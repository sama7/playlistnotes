# v2.playlistnotes.io — now a permanent redirect to trackjot.com.
#
# The host is kept alive rather than switched off, and its certificate kept
# renewing, because share links are the product's one durable public artifact.
# A `/n/<token>` pasted into a group chat before the rename must keep working,
# and it only can if this name still answers over TLS.
#
# `$request_uri` preserves path AND query string, so a share token survives the
# hop intact. 301 rather than 302, so clients and any future index treat
# trackjot.com as canonical instead of asking here forever.
#
# The ACME challenge location stays above the redirect. Without it renewal
# fails, the certificate expires, and every old link starts throwing a TLS
# warning rather than redirecting — worse than having no redirect at all.

server {
    listen 80;
    listen [::]:80;
    server_name v2.playlistnotes.io;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://trackjot.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name v2.playlistnotes.io;

    ssl_certificate /etc/letsencrypt/live/v2.playlistnotes.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/v2.playlistnotes.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://trackjot.com$request_uri;
    }
}
