# nginx vhost for the gated v2 staging host.
#
# Installed at /etc/nginx/sites-available/v2.playlistnotes.io and symlinked into
# sites-enabled. It is the ONLY thing on this droplet that touches Playlistnotes
# traffic; MKDb's vhost, cert, and port 3000 are never modified.
#
# This file is the pre-TLS form. Certbot rewrites it in place when the
# certificate is issued, adding the 443 server block and the redirect. It cannot
# run until v2.playlistnotes.io has an A record pointing at this droplet, since
# the HTTP-01 challenge is served from this vhost.

server {
    listen 80;
    listen [::]:80;
    server_name v2.playlistnotes.io;

    # Certbot's HTTP-01 challenge. Kept above the proxy so renewals never
    # depend on the application being up.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Imports can carry a whole playlist's worth of rows; the default 1m is
    # tight. Still bounded, so a large upload cannot exhaust the 2 GB box.
    client_max_body_size 8m;

    location / {
        # IPv4 loopback. The app binds here deliberately — see
        # scripts/start-standalone.cjs — so nginx is the only way in.
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        # The app trusts these to build absolute URLs and to see the real
        # client. nginx overwrites rather than appends, so a client cannot
        # forge them.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
