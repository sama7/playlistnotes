# nginx vhost for the gated v2 staging host — POST-CERTBOT, as actually running.
#
# Certbot rewrote this file in place when it issued the certificate on
# 2026-08-10, adding the 443 server block, the HTTP redirect, and a catch-all
# 404 for requests arriving on port 80 with this Host. This copy is pulled back
# from the droplet so the repository matches reality rather than the pre-TLS
# form that was committed first.
#
# It is the ONLY thing on this droplet touching TrackJot traffic. MKDb's
# vhost, certificate, and port 3000 are never modified.
#
# `# managed by Certbot` lines belong to certbot's renewal machinery. Editing
# them by hand is how a renewal quietly stops working, so change them through
# certbot, then re-pull this file.

server {
    server_name v2.playlistnotes.io;

    # Certbot's HTTP-01 challenge. Kept above the proxy so renewals never
    # depend on the application being up.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Imports can carry a whole playlist's worth of rows; the default 1m is
    # tight. Still bounded, so a large upload cannot exhaust the 2 GB box.
    client_max_body_size 8m;

    location / {
        # IPv4 loopback. The app binds here deliberately — see
        # scripts/start-standalone.cjs — so nginx is the only way in.
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        # The app trusts these to build absolute URLs and to see the real
        # client. nginx overwrites rather than appends, so a client cannot
        # forge them.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/v2.playlistnotes.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/v2.playlistnotes.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = v2.playlistnotes.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name v2.playlistnotes.io;
    return 404; # managed by Certbot


}