# nginx vhost for trackjot.com — the canonical production hostname.
#
# Installed at /etc/nginx/sites-available/trackjot.com and symlinked into
# sites-enabled. It is added ALONGSIDE the v2.playlistnotes.io vhost rather than
# replacing it: old share links must keep working, and the staging host stays
# serving until TrackJot passes its own smoke tests.
#
# This is the pre-TLS form. Certbot rewrites it in place, adding the 443 blocks
# and the HTTP redirect, once both names resolve to this droplet. It cannot run
# before that, since the HTTP-01 challenge is served from here.
#
# `www` redirects to the apex rather than being served in parallel. Two hostnames
# serving identical content splits share links, splits any future search
# authority, and — the reason that actually matters here — would need passkeys
# and Sign in with Apple registered against two relying-party domains.

server {
    listen 80;
    listen [::]:80;
    server_name www.trackjot.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # 308 rather than 301: it preserves the request method and body, so a POST
    # that lands here is not silently downgraded to a GET.
    location / {
        return 308 https://trackjot.com$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name trackjot.com;

    # Certbot's HTTP-01 challenge. Above the proxy so renewals never depend on
    # the application being up.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Imports can carry a whole playlist's worth of rows; the default 1m is
    # tight. Still bounded, so an upload cannot exhaust the 2 GB box.
    client_max_body_size 8m;

    location / {
        # IPv4 loopback. The app binds here deliberately — see
        # scripts/start-standalone.cjs — so nginx is the only way in.
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        # The app trusts these to build absolute URLs and to see the real
        # client. nginx overwrites rather than appends, so a client cannot
        # forge them.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
