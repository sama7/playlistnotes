name: CI

on:
  push:
    branches: [v2]
  pull_request:
    branches: [v2]

# main is deliberately absent. It is frozen: it auto-deploys v1 to Heroku, and
# v1 pins EOL Node 18, so a build there would likely fail.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: playlistnotes_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/playlistnotes_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/playlistnotes_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/playlistnotes_test
      APP_BASE_URL: http://localhost:3100

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Proves the schema applies to a genuinely empty database, which is the
      # only way to know the migration history is coherent.
      - name: Migrate from empty
        run: npx prisma migrate deploy

      - name: Migration status
        run: npx prisma migrate status

      - name: Integration tests
        run: npm run test:integration

      # The core acceptance path must pass with NO Spotify configuration at all.
      # v2 uses no Spotify OAuth; this guards against a dependency creeping in.
      - name: Assert no Spotify credentials are required
        run: |
          if grep -rniE 'SPOTIFY_(CLIENT_SECRET|CLIENT_ID|ACCESS_TOKEN|REFRESH_TOKEN)' \
              --include='*.ts' --include='*.tsx' --include='*.json' \
              --exclude-dir=node_modules . ; then
            echo "::error::Spotify OAuth credentials referenced in source."
            exit 1
          fi
          echo "No Spotify credential references found."

  build:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # Build here, not on the droplet: a `next build` spike alongside MKDb and
      # its local PostgreSQL on a 2 GB box risks the OOM killer.
      - name: Build standalone artifact
        run: npm run build
        env:
          # A build-time placeholder. Runtime URLs come from the deployed
          # environment so no hostname is ever baked into stored records.
          APP_BASE_URL: https://v2.playlistnotes.io
          # Prerendering evaluates ClerkProvider, so the build genuinely
          # requires a publishable key. It is a PUBLIC value (it ships to the
          # browser), so a repository variable is the right home for it — not a
          # secret. CLERK_SECRET_KEY is never needed at build time.
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}

      - name: Package artifact
        run: |
          mkdir -p artifact
          cp -r .next/standalone/. artifact/
          mkdir -p artifact/.next
          cp -r .next/static artifact/.next/static
          if [ -d public ]; then cp -r public artifact/public; fi

      - uses: actions/upload-artifact@v4
        with:
          name: playlistnotes-standalone
          path: artifact
          retention-days: 7
