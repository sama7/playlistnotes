name: CI

on:
  push:
    branches: [v2]
  pull_request:
    branches: [v2]

# main is deliberately absent. It is frozen: it auto-deploys v1 to Heroku, and
# v1 pins EOL Node 18, so a build there would likely fail.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trackjot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trackjot_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/trackjot_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trackjot_test
      APP_BASE_URL: http://localhost:3100

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Proves the schema applies to a genuinely empty database, which is the
      # only way to know the migration history is coherent.
      - name: Migrate from empty
        run: npx prisma migrate deploy

      - name: Migration status
        run: npx prisma migrate status

      - name: Integration tests
        run: npm run test:integration

      # The core acceptance path must pass with NO Spotify configuration at all.
      # v2 uses no Spotify OAuth; this guards against a dependency creeping in.
      # Spotify metadata via Client Credentials is optional enrichment, so a
      # reference to SPOTIFY_CLIENT_SECRET is now legitimate. What must never
      # appear is USER OAuth: tokens, refresh tokens, or a callback. Those are
      # what the five-user cap counts, and v2 has none of them.
      - name: Assert no Spotify user-OAuth surface exists
        run: |
          if grep -rniE 'SPOTIFY_(ACCESS_TOKEN|REFRESH_TOKEN|REDIRECT_URI)|authorizationCodeGrant|/api/spotify/callback' \
              --include='*.ts' --include='*.tsx' --include='*.json' \
              --exclude-dir=node_modules . ; then
            echo "::error::Spotify user-OAuth surface referenced in source."
            exit 1
          fi
          echo "No Spotify user-OAuth surface found."

      # The core independence invariant: the suite passes with the optional
      # credential absent. CI never sets it, so this is enforced by omission.
      - name: Assert the core suite runs with no Spotify credential
        run: |
          if [ -n "${SPOTIFY_CLIENT_SECRET:-}" ]; then
            echo "::error::CI must not configure SPOTIFY_CLIENT_SECRET."
            exit 1
          fi
          echo "No Spotify credential configured in CI, as intended."

  build:
    runs-on: ubuntu-latest
    needs: verify

    # Present for the smoke step below, which needs a real database to prove the
    # artifact can reach one. Declared the same way as the verify job's, rather
    # than started by hand, so both jobs fail the same way when it misbehaves.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trackjot_smoke
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # Build here, not on the droplet: a `next build` spike alongside MKDb and
      # its local PostgreSQL on a 2 GB box risks the OOM killer.
      # NEXT_PUBLIC_* values are INLINED INTO THE BUNDLE at build time, so the
      # artifact CI produces carries whichever Clerk instance this key belongs
      # to. A placeholder would build green and then point production at the
      # wrong instance, so the build fails loudly instead.
      - name: Require the Clerk publishable key
        run: |
          if [ -z "${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}" ]; then
            echo "::error::Repository variable NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY is not set."
            echo "Add it at: Settings → Secrets and variables → Actions → Variables → New repository variable"
            echo "It is a PUBLIC value (pk_test_… / pk_live_…), so it belongs in Variables, not Secrets."
            echo "Use the development key for now; swap it for the production key before the first real deploy."
            exit 1
          fi

      - name: Build standalone artifact
        run: npm run build
        env:
          # A build-time placeholder. Runtime URLs come from the deployed
          # environment so no hostname is ever baked into stored records.
          APP_BASE_URL: https://trackjot.com
          # Prerendering evaluates ClerkProvider, so the build genuinely
          # requires a publishable key. It is a PUBLIC value (it ships to the
          # browser), so a repository variable is the right home for it — not a
          # secret. CLERK_SECRET_KEY is never needed at build time.
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}

      - name: Package artifact
        run: |
          mkdir -p artifact
          cp -r .next/standalone/. artifact/
          mkdir -p artifact/.next
          cp -r .next/static artifact/.next/static
          if [ -d public ]; then cp -r public artifact/public; fi
          # The production entry point. It carries environment invariants that
          # would otherwise live in a pm2 flag and be lost on the next restart.
          mkdir -p artifact/scripts
          cp scripts/start-standalone.cjs scripts/smoke.js scripts/check-env.mjs artifact/scripts/
          # Migrations travel with the artifact so the droplet can run
          # `prisma migrate deploy` without a checkout of the repository.
          cp -r prisma artifact/prisma

      # Boot the packaged artifact and make real requests to it. Every check
      # before this point passes against source; this is the only one that
      # proves the thing we actually ship can serve a page. It was added after a
      # green build shipped an artifact on which every rendering route hung.
      - name: Smoke test the packaged artifact
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trackjot_smoke
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/trackjot_smoke
          APP_BASE_URL: http://127.0.0.1:3001
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          # Anonymous requests never reach Clerk's API — the key only has to be
          # present for the middleware to construct its client. A real secret is
          # therefore not needed, and deliberately not used, in CI.
          CLERK_SECRET_KEY: sk_test_0000000000000000000000000000000000000000
        run: |
          set -euo pipefail
          npx prisma migrate deploy
          node artifact/scripts/start-standalone.cjs &
          echo $! > /tmp/smoke.pid
          # Wait for the port to answer at all. A boot failure must surface as a
          # failing smoke check, not as a silent hang, so this loop is bounded
          # and the checks run either way.
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:3001/api/health && break
            sleep 2
          done
          node scripts/smoke.js http://127.0.0.1:3001
          kill "$(cat /tmp/smoke.pid)" || true

      - uses: actions/upload-artifact@v4
        with:
          name: trackjot-standalone
          path: artifact
          retention-days: 7

  # Browser-level acceptance tests against the artifact this workflow just built.
  #
  # A separate job rather than more steps on `build`, so a browser failure is
  # distinguishable at a glance from a packaging failure, and so the artifact is
  # still uploaded when a spec breaks.
  #
  # This needs the REAL development secret key, and that is a finding rather
  # than a preference: with a placeholder, a real browser follows Clerk's
  # development handshake, returns with a handshake token, and the server 500s
  # verifying it. Reproduced locally before adding this job.
  e2e:
    runs-on: ubuntu-latest
    needs: build

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trackjot_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trackjot_e2e
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/trackjot_e2e
      APP_BASE_URL: http://localhost:3001
      # DEVELOPMENT keys, deliberately, and they must be a matched pair.
      #
      # Clerk validates that the publishable and secret keys belong to the same
      # instance. Once the production variable holds a pk_live, pairing it with
      # the development secret fails at sign-in — so this job cannot reuse the
      # artifact the build job produced, and builds its own with dev keys.
      #
      # The trade is explicit: e2e no longer exercises the byte-identical
      # package that ships. It exercises the same source with a different key
      # baked in, which is what the tests are actually about. The smoke check in
      # the build job still runs against the real artifact.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY_DEV }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Require a matched pair of development Clerk keys
        run: |
          if [ -z "${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}" ]; then
            echo "::error::Repository variable NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY_DEV is not set."
            echo "The browser suite needs the DEVELOPMENT publishable key (pk_test_…),"
            echo "because NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY now holds the production one."
            echo "Add it at: Settings → Secrets and variables → Actions → Variables"
            exit 1
          fi
          case "${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}" in
            pk_live_*)
              echo "::error::NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY_DEV holds a PRODUCTION key."
              exit 1
              ;;
          esac
          if [ -z "${CLERK_SECRET_KEY}" ]; then
            echo "::error::Repository secret CLERK_SECRET_KEY is not set."
            echo "Add the DEVELOPMENT secret key (sk_test_…) at:"
            echo "  Settings → Secrets and variables → Actions → Secrets"
            exit 1
          fi
          case "${CLERK_SECRET_KEY}" in
            sk_live_*)
              # The suite signs up real accounts. Against a production instance
              # that would create real users on every push.
              echo "::error::CLERK_SECRET_KEY is a PRODUCTION key. Use the development key."
              exit 1
              ;;
          esac

      # WebKit as well as Chromium, and that is not a nicety: the layout specs
      # run a `webkit-layout` project because the faults people actually report
      # are found on iOS Safari. `<input type="date">` has a far wider intrinsic
      # width there than in Chromium, which is how a date input came to be
      # painted straight through the select beside it while every Chromium check
      # reported the page clean.
      - run: npx playwright install --with-deps chromium webkit

      - name: Migrate the disposable database
        run: npx prisma migrate deploy

      - name: Build with the development key
        run: npm run build

      - name: Package it
        run: |
          mkdir -p artifact
          cp -r .next/standalone/. artifact/
          mkdir -p artifact/.next
          cp -r .next/static artifact/.next/static
          if [ -d public ]; then cp -r public artifact/public; fi
          mkdir -p artifact/scripts
          cp scripts/start-standalone.cjs scripts/smoke.js scripts/check-env.mjs artifact/scripts/

      - name: Start it
        run: |
          node artifact/scripts/start-standalone.cjs >/tmp/app.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:3001/api/health && break
            sleep 2
          done
          # The loop above exits 0 whether or not it ever succeeded, so a server
          # that never bound would otherwise fail much later, as a browser test.
          curl -sf -o /dev/null http://localhost:3001/api/health \
            || { echo "the app never became healthy"; tail -40 /tmp/app.log; exit 1; }

      # Three reporters, and each one earns its place.
      #
      # `github` is the important one: it turns every failure into a workflow
      # **annotation**, and annotations are readable through the public API
      # without admin rights on the repository. Job logs are not — downloading
      # them returns 403 — so when the browser suite failed on a7dbf8f the only
      # thing visible from a developer machine was "Process completed with exit
      # code 1". A failure nobody can read is a failure nobody can fix.
      #
      # `line` keeps the log itself readable, and `html` produces the report
      # that the upload step below has always asked for and never found: passing
      # `--reporter=line` on the command line overrode the config, so
      # `playwright-report` was never written.
      - name: Run the browser suite
        env:
          PLAYWRIGHT_HTML_OPEN: never
        run: E2E_BASE_URL=http://localhost:3001 npx playwright test --reporter=github,line,html

      # ---------------------------------------------------------------------
      # The connected Last.fm experience, against a fixture.
      #
      # Everything above runs with no Last.fm credentials, which is the right
      # way to prove the product behaves when the integration is absent — and
      # it meant the half a person actually uses was never demonstrated here at
      # all: every test for it skipped, silently, on every green build.
      #
      # A real API key would not fix that. The suite would then depend on a
      # third party's uptime, on one real account's listening, and on rows that
      # change between runs, so a red build would mean "Last.fm changed" as
      # often as "we broke something". **No credential is needed for this and
      # none should be added** — the values below are deliberate nonsense, and
      # the endpoints point at a fixture server in this repository.
      # ---------------------------------------------------------------------
      - name: Start the Last.fm fixture
        run: |
          node scripts/lastfm-fixture-server.mjs 4599 >/tmp/lastfm-fixture.log 2>&1 &
          for _ in $(seq 1 20); do
            curl -sf -o /dev/null "http://127.0.0.1:4599/?method=user.getinfo&user=x" && break
            sleep 1
          done

      - name: Restart the app pointed at the fixture
        env:
          LASTFM_API_KEY: ffffffffffffffffffffffffffffffff
          LASTFM_SHARED_SECRET: ffffffffffffffffffffffffffffffff
          LASTFM_API_BASE: http://127.0.0.1:4599/
          LASTFM_AUTH_PAGE: http://127.0.0.1:4599/api/auth/
        run: |
          pkill -f start-standalone.cjs || true
          sleep 2
          node artifact/scripts/start-standalone.cjs >/tmp/app-lastfm.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:3001/api/health && break
            sleep 2
          done
          curl -sf -o /dev/null http://localhost:3001/api/health \
            || { echo "the app never came back up"; tail -40 /tmp/app-lastfm.log; exit 1; }
          # Prove the app can actually reach the fixture before the browser
          # tries to. A failure here is unambiguous; a failure later looks like
          # "the strip is empty" and could be any of four things.
          curl -sf "http://127.0.0.1:4599/?method=user.getinfo&user=x" >/dev/null \
            || { echo "fixture unreachable from the runner"; cat /tmp/lastfm-fixture.log; exit 1; }

      - name: Run the connected Last.fm suite
        env:
          PLAYWRIGHT_HTML_OPEN: never
          E2E_BASE_URL: http://localhost:3001
          E2E_LASTFM_FIXTURE: "1"
        run: npx playwright test tests/e2e/lastfm-connected.spec.ts --reporter=github,line

      # Job logs need admin rights to download, so anything worth reading after
      # a failure has to be printed into the step's own output — where the
      # github reporter's annotations can carry it out.
      - name: Show the server and fixture logs
        if: failure()
        run: |
          echo "===== app (first start) ====="
          tail -40 /tmp/app.log || true
          echo "===== app (pointed at the fixture) ====="
          tail -80 /tmp/app-lastfm.log || true
          echo "===== Last.fm fixture ====="
          tail -40 /tmp/lastfm-fixture.log || true

      # Every run signs up fresh accounts; without this they accumulate in the
      # development instance forever. Runs even when the suite fails, because a
      # failed run creates users too. Refuses a production key outright.
      - name: Delete the test accounts this run created
        if: always()
        run: node scripts/clean-test-users.mjs

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
